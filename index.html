<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MISMO Initiative Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#101B33; --ink-soft:#4B5670; --paper:#F1F3F9; --card:#FFFFFF; --line:#E1E4EC;
    --brand:#2A4DFF; --brand-soft:#EAF0FF; --brand-text:#1E3ACC;
    --teal:#0E9488; --gold:#D97706; --rose:#C2255C; --violet:#7C3AED; --fuchsia:#C026D3; --graphite:#475569;
    --indigo:#4F46E5; --crimson:#9F1239;
    --success-soft:#E7F7EE; --success-text:#157A44;
    --slate:#8B94A7; --slate-soft:#EEF0F4; --slate-text:#5B6478;
    --badge-ink:#101B33;
    --radius:14px; --shadow:0 1px 2px rgba(16,27,51,.04), 0 4px 14px rgba(16,27,51,.05);
  }
  html[data-theme="dark"]{
    --ink:#E8EAF0; --ink-soft:#A0A8C0; --paper:#0B0F1C; --card:#161C30; --line:#2A3150;
    --brand:#5B85FF; --brand-soft:#1A2745; --brand-text:#9AB8FF;
    --teal:#14B8A6; --gold:#F0930D; --rose:#E0417A; --violet:#9660F5; --fuchsia:#D946E4; --graphite:#64748B;
    --success-soft:#123024; --success-text:#4ADE80;
    --slate:#6B7488; --slate-soft:#202536; --slate-text:#A0A8C0;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 4px 14px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box;}
  ::selection{background:var(--brand); color:#fff;}
  body{
    margin:0; background:var(--paper); color:var(--ink); font-family:'Inter',sans-serif;
    transition:background .2s ease, color .2s ease;
  }
  .masthead{padding:36px 24px 24px; background:var(--card); border-bottom:1px solid var(--line); transition:background .2s ease, border-color .2s ease;}
  .masthead-inner{max-width:1100px; margin:0 auto; display:flex; align-items:center; justify-content:space-between; gap:24px; flex-wrap:wrap;}
  .eyebrow-row{display:flex; align-items:center; gap:10px; margin-bottom:12px;}
  .sponsor-mark{font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:11px; letter-spacing:.06em; background:var(--badge-ink); color:#fff; padding:3px 8px; border-radius:4px;}
  .eyebrow{font-size:12.5px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-soft);}
  h1{font-size:30px; font-weight:700; margin:0;}
  .subtitle{font-size:14px; color:var(--ink-soft); max-width:560px; margin-top:8px;}
  .calendar-link{
    display:flex; align-items:center; gap:12px; flex:0 0 auto;
    background:var(--brand-soft); border:1px solid var(--brand); border-radius:var(--radius);
    padding:14px 20px; text-decoration:none; color:var(--brand-text);
  }
  .calendar-link:hover{background:var(--brand); color:#fff;}
  .calendar-link svg{flex:0 0 auto;}
  .calendar-link-text{display:flex; flex-direction:column; gap:1px;}
  .calendar-link-title{font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:13.5px;}
  .calendar-link-sub{font-size:11px; opacity:.8;}
  .masthead-actions{display:flex; align-items:center; gap:10px; flex:0 0 auto;}
  .theme-toggle{
    display:flex; align-items:center; justify-content:center; flex:0 0 auto;
    width:48px; height:48px; border-radius:50%; border:1px solid var(--line); background:var(--card);
    color:var(--ink-soft); cursor:pointer; transition:background .15s ease, border-color .15s ease, color .15s ease;
  }
  .theme-toggle:hover{background:var(--brand-soft); border-color:var(--brand); color:var(--brand-text);}
  .theme-toggle svg{width:20px; height:20px;}
  .theme-toggle .icon-moon{display:none;}
  html[data-theme="dark"] .theme-toggle .icon-sun{display:none;}
  html[data-theme="dark"] .theme-toggle .icon-moon{display:block;}

  .wrap{max-width:1100px; margin:0 auto; padding:28px 24px 70px;}

  /* Tile size restored to match the original mockup's markup exactly */
  .tile-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin-bottom:22px;}
  @media (max-width:900px){.tile-grid{grid-template-columns:repeat(2,1fr);}}
  @media (max-width:500px){.tile-grid{grid-template-columns:1fr;}}

  .domain-tile{
    border:2px solid var(--line); border-radius:var(--radius); background:var(--card); cursor:pointer;
    padding:22px 22px 20px; display:flex; flex-direction:column; gap:14px; min-height:150px; text-align:left;
    transition:border-color .15s ease, transform .15s ease, background .2s ease;
  }
  .domain-tile:hover{transform:translateY(-2px);}
  .domain-tile.active{border-color:var(--tile-color); background:var(--tile-soft);}
  .domain-tile.intro-highlight{border-color:var(--tile-color); background:var(--tile-soft); transition:border-color .6s ease, background .6s ease;}
  .domain-tile.intro-highlight .tile-name{color:#101B33; transition:color .6s ease;}
  .domain-tile.intro-highlight .tile-desc{color:#4B5670; transition:color .6s ease;}
  .domain-tile.intro-highlight .tile-count{color:#4B5670; transition:color .6s ease;}
  .domain-tile.intro-highlight .tile-icon-wrap{background:var(--tile-color); color:#fff; transition:background .6s ease, color .6s ease;}
  .tile-top-row{display:flex; align-items:center; gap:12px;}
  .tile-icon-wrap{
    width:40px; height:40px; border-radius:10px; display:flex; align-items:center; justify-content:center; flex:0 0 auto;
    background:var(--tile-soft); color:var(--tile-color); transition:background .15s ease, color .15s ease;
  }
  .domain-tile.active .tile-icon-wrap{background:var(--tile-color); color:#fff;}
  .tile-icon-wrap svg{width:20px; height:20px;}
  .tile-name{font-family:'Space Grotesk',sans-serif; font-size:16.5px; font-weight:700; color:var(--ink);}
  .domain-tile.active .tile-name{color:#101B33;}
  .tile-desc{font-size:12.5px; color:var(--ink-soft); line-height:1.5; flex:1;}
  .domain-tile.active .tile-desc{color:#4B5670;}
  .tile-count{font-size:12px; color:var(--ink-soft); font-family:'IBM Plex Mono',monospace;}
  .domain-tile.active .tile-count{color:#4B5670;}

  .panel{
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow);
    padding:26px 26px 24px; color:var(--ink); transition:background .2s ease, border-color .2s ease;
  }
  .panel-head{display:flex; align-items:center; gap:12px; margin-bottom:20px;}
  .panel-icon-wrap{
    width:44px; height:44px; border-radius:12px; display:flex; align-items:center; justify-content:center; flex:0 0 auto;
    background:var(--tile-color);
  }
  .panel-icon-wrap svg{width:22px; height:22px; color:#fff;}
  .panel-title{font-family:'Space Grotesk',sans-serif; font-size:21px; font-weight:700; color:var(--ink);}
  .panel-sub{font-size:12.5px; color:var(--ink-soft);}

  .init-grid{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
  @media (max-width:760px){.init-grid{grid-template-columns:1fr;}}

  .init-card{border:1px solid var(--line); border-radius:12px; padding:18px 19px; background:var(--paper); transition:background .2s ease, border-color .2s ease;}
  .init-top{display:flex; justify-content:space-between; align-items:flex-start; gap:10px; margin-bottom:4px;}
  .init-title{font-family:'Space Grotesk',sans-serif; font-size:15px; font-weight:700; color:var(--ink);}
  .badge-row{display:flex; gap:6px; flex-wrap:wrap; flex:0 0 auto;}
  .status-badge{
    font-size:9.5px; font-weight:700; padding:3px 9px; border-radius:999px; white-space:nowrap;
    background:var(--success-soft); color:var(--success-text); text-transform:uppercase; letter-spacing:.03em;
  }
  .status-badge.planned{background:var(--slate-soft); color:var(--slate-text);}
  .sample-badge{
    font-size:9.5px; font-weight:700; letter-spacing:.03em; text-transform:uppercase;
    padding:3px 8px; border-radius:999px; border:1px dashed var(--slate); color:var(--slate-text);
    background:var(--card); white-space:nowrap;
  }

  .detail-block{margin-top:12px;}
  .detail-label{
    display:block; font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.05em;
    color:var(--ink-soft); margin-bottom:4px;
  }
  .detail-text{font-size:13px; color:var(--ink); margin:0; line-height:1.5;}
  .why-bullets{margin:0; padding-left:16px; font-size:13px; color:var(--ink); line-height:1.5;}
  .why-bullets li{margin-bottom:4px;}
  .why-bullets li:last-child{margin-bottom:0;}
  .snapshot-stat{
    display:inline-block; font-family:'IBM Plex Mono',monospace; font-size:11.5px;
    font-weight:600; background:var(--brand-soft); color:var(--brand-text); padding:4px 10px; border-radius:999px;
    width:fit-content; margin:0;
  }

  .view-link{
    display:inline-flex; align-items:center; gap:6px; margin-top:14px;
    padding:10px 18px; border-radius:8px; border:none;
    font-size:13px; font-weight:700; color:#fff; background:var(--brand);
    text-decoration:none; transition:background .15s ease, transform .15s ease;
  }
  .view-link:hover{background:var(--brand-text); transform:translateY(-1px);}
  .view-link-disabled{
    display:inline-flex; align-items:center; margin-top:14px;
    padding:10px 18px; border-radius:8px; border:1px dashed var(--line);
    font-size:13px; font-weight:700; color:var(--ink-soft); font-style:italic;
  }
  .empty-hint{font-size:13px; color:var(--ink-soft); text-align:center; padding:26px 0;}
</style>
</head>
<body>

<div class="masthead">
  <div class="masthead-inner">
    <div>
      <div class="eyebrow-row">
        <span class="sponsor-mark">MISMO</span>
        <span class="eyebrow">Initiative Library</span>
      </div>
      <h1>Welcome to the MISMO Initiative Hub</h1>
      <p class="subtitle">Explore active workgroup initiatives organized by domain — pick a domain below to see what's being built, who's involved, and how far along it is.</p>
    </div>
    <div class="masthead-actions">
      <a class="calendar-link" href="calendar.html">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
        <div class="calendar-link-text">
          <span class="calendar-link-title">Meeting Calendar</span>
          <span class="calendar-link-sub">See all workgroup schedules →</span>
        </div>
      </a>
      <button type="button" class="theme-toggle" id="replayTourBtn" aria-label="Replay the color tour with sound" title="Replay with sound">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 6a9 9 0 0 1 0 12"/></svg>
      </button>
      <button type="button" class="theme-toggle" id="themeToggleBtn" aria-label="Toggle dark mode">
        <svg class="icon-sun" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 3v2M12 19v2M5 5l1.5 1.5M17.5 17.5L19 19M3 12h2M19 12h2M5 19l1.5-1.5M17.5 6.5L19 5"/></svg>
        <svg class="icon-moon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5Z"/></svg>
      </button>
    </div>
  </div>
</div>

<div class="wrap">
  <div class="tile-grid" id="tileGrid"></div>
  <div id="panelArea"></div>
</div>

<script>
  const initiatives = [
    {
      title: 'Mortgage Compliance Dataset', domains: ['Compliance'], status: 'live', href: 'mcd-dashboard.html', sample: false,
      whatIsIt: 'A standard set of loan data fields and delivery file format that mortgage lenders and independent mortgage banks provide to regulators for the loan-level review portion of regulatory compliance examinations — designed to replace the Loan Examination File (LEF).',
      whyWorking: ['Manual, inconsistent reviews slow examinations down.', 'Inconsistent formats break compliance technology.', 'Lenders want to catch issues before the exam.'],
      whoBroughtIt: 'MISMO, in partnership with CSBS · sponsored by Asurity · Version 2.0 published Dec 11, 2025',
      publicationStatus: 'Published — Version 2.0',
      estimatedSavings: 'No published $ estimate yet'
    },
    {
      title: 'Common Confidence Score', domains: ['Originations', 'Valuation'], status: 'live', href: 'ccs-dashboard.html', sample: false,
      whatIsIt: 'A standardized probability score — the estimated likelihood an AVM value falls within ±10% of market value — that lets lenders and investors compare valuation risk across different AVM providers on one common scale, replacing inconsistent provider-specific confidence formats.',
      whyWorking: ['Inconsistent scores make AVMs hard to compare.', 'The accurate alternative is too complex to adopt.', 'A 2024 federal rule raised the stakes.'],
      whoBroughtIt: 'AVM providers &amp; the Mortgage Bankers Association, in response to the CFPB\'s AVM quality control rule — though that rule is not currently being enforced · Reached Recommendation status April 21, 2026',
      publicationStatus: 'Published — though the federal rule it responds to is not currently being enforced',
      estimatedSavings: 'No published $ figure — sources describe reduced QC costs and faster valuation decisions only'
    },
    {
      title: 'MISMO FRAME', domains: ['Artificial Intelligence', 'Governance'], status: 'planned', href: null, sample: false,
      whatIsIt: 'An AI governance toolkit — five practical artifacts (Governance Policy, AI System Inventory, and System Risk Assessment now available; Performance &amp; Fairness Testing and an Incident &amp; Change Management Log deferred) built on the NIST AI Risk Management Framework and tailored to mortgage-specific rules like ECOA, the Fair Housing Act, and SR 11-7.',
      whyWorking: ['No shared AI governance framework existed for mortgage lending specifically.', 'Fair lending laws raise real compliance risk for ungoverned AI use.', 'Industry asked MISMO to lead, rather than each lender building its own framework.'],
      whoBroughtIt: 'Industry participants seeking AI governance guidance — the idea originated with the MBA\'s Residential Board of Governors (RESBOG), which asked MISMO to lead · Released June 11, 2026 at MISMO\'s Spring Summit',
      publicationStatus: 'Released — June 2026',
      estimatedSavings: 'No published $ figure — framed as a risk-management and compliance tool, not a cost-savings initiative'
    },
    {
      title: 'Tri-Party eNote Bailee Agreement', domains: ['eMortgage'], status: 'live', href: 'tpa-dashboard.html', sample: false,
      whatIsIt: 'A MISMO-developed, consensus-based industry template for Master Bailee Agreements (MBAs) — the tri-party agreements among lender, warehouse lender, and investor that govern custody of an eNote\'s authoritative copy during the funding gap.',
      whyWorking: ['Reduced outside legal review and negotiation.', 'Reduced internal legal and onboarding effort.', 'Lower ongoing compliance and interpretation cost.'],
      whoBroughtIt: 'Snapdocs (Camelia Martin), via a MISMO DWG proposal · Discovery workshop planned for August 2026',
      publicationStatus: 'Proposed — Discovery workshop scheduled, not yet chartered as a workgroup',
      estimatedSavings: '$17,000–$45,000 per agreement in avoided legal and compliance cost'
    },
    {
      title: 'Investor Reporting Dataset', domains: ['Servicing'], status: 'planned', href: null, sample: true,
      whatIsIt: 'A standardized dataset defining what servicers report to investors — GSEs and private-label securitizers — on loan performance, remittance, and portfolio status each cycle.',
      whyWorking: ['Inconsistent servicer-to-investor reporting formats slow reconciliation.', 'Manual reporting increases the risk of remittance errors.'],
      whoBroughtIt: 'GSEs &amp; master servicers · Started January 2024',
      publicationStatus: 'In Development',
      estimatedSavings: '$3–$18 per loan per reporting cycle in reduced reconciliation effort'
    },
    {
      title: 'Loan Boarding Dataset', domains: ['Servicing'], status: 'live', href: 'lbds-dashboard.html', sample: false,
      whatIsIt: 'A standardized, extensible dataset defining the core information needed to board newly originated loans into servicing systems consistently and reliably. First published piece of MISMO\'s broader Industry Transfer of Servicing Dataset (ITSD).',
      whyWorking: ['Manual loan boarding drives up labor costs.', 'Rework and reconciliation delay activation.', 'Inconsistent data leaves borrowers with misdirected payments and account gaps.'],
      whoBroughtIt: 'GSEs, NewRez &amp; Flagstar · Started February 2023',
      publicationStatus: 'Removed from GSE roadmap — Flagstar no longer involved',
      estimatedSavings: '$17–$89 per loan'
    }
  ];

  const domainIcons = {
    'Compliance': '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l8 4v6c0 5-3.5 8.5-8 10-4.5-1.5-8-5-8-10V6l8-4Z"/><path d="M9 12l2 2 4-4"/></svg>',
    'eMortgage': '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>',
    'Servicing': '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"/><path d="M5 10v9h14v-9"/></svg>',
    'Originations': '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V6a2 2 0 0 1 2-2h8l6 6v9a2 2 0 0 1-2 2Z"/><path d="M14 4v5h5"/></svg>',
    'Valuation': '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 15l4-5 3 3 5-7"/></svg>',
    'Artificial Intelligence': '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="8" width="16" height="12" rx="2"/><path d="M12 8V4M9 4h6"/><circle cx="9" cy="14" r="1.3"/><circle cx="15" cy="14" r="1.3"/></svg>',
    'Governance': '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v5c0 5-3.5 8-8 10-4.5-2-8-5-8-10V6l8-3Z"/></svg>',
    'Secondary': '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 10l-4-4 4-4"/><path d="M3 6h13a4 4 0 0 1 4 4v1"/><path d="M17 14l4 4-4 4"/><path d="M21 18H8a4 4 0 0 1-4-4v-1"/></svg>',
    'Credit Reporting': '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"/><path d="M14 2v6h6"/><path d="M9 13h6M9 17h6M9 9h1"/></svg>'
  };

  const domainMeta = {
    'Compliance': {color:'var(--teal)', soft:'#E3F5F3', desc:'Standardized data for regulatory exams and compliance reporting.'},
    'eMortgage': {color:'var(--gold)', soft:'#FDF0DE', desc:'Standards for eNotes, eClosing, and digital mortgage agreements.'},
    'Servicing': {color:'var(--brand)', soft:'#EAF0FF', desc:'Data standards for the handoff from origination into loan servicing.'},
    'Originations': {color:'var(--rose)', soft:'#FCE7EF', desc:'Standards used during loan origination and underwriting.'},
    'Valuation': {color:'var(--violet)', soft:'#F1EBFD', desc:'Appraisal and automated valuation model (AVM) standards.'},
    'Artificial Intelligence': {color:'var(--fuchsia)', soft:'#FBE8FC', desc:'Governance frameworks for responsible AI use in mortgage lending.'},
    'Governance': {color:'var(--graphite)', soft:'#EEF1F4', desc:'Oversight and risk-management standards across MISMO\'s initiatives.'},
    'Secondary': {color:'var(--indigo)', soft:'#EBEAFD', desc:'Standards for the secondary market where loans are sold, pooled, and securitized.'},
    'Credit Reporting': {color:'var(--crimson)', soft:'#FBE7EC', desc:'Standards for pulling, formatting, and exchanging consumer credit data.'}
  };
  const domainOrder = ['Artificial Intelligence','Compliance','Credit Reporting','eMortgage','Governance','Originations','Secondary','Servicing','Valuation'];

  const tileGrid = document.getElementById('tileGrid');
  const panelArea = document.getElementById('panelArea');

  let activeDomain = null;

  function itemsFor(domain){
    return initiatives.filter(i => i.domains.includes(domain));
  }

  function renderTiles(){
    tileGrid.innerHTML = domainOrder.map(domain => {
      const count = itemsFor(domain).length;
      const meta = domainMeta[domain];
      return `<button class="domain-tile${domain === activeDomain ? ' active' : ''}" style="--tile-color:${meta.color}; --tile-soft:${meta.soft};" data-domain="${domain}">
        <div class="tile-top-row">
          <span class="tile-icon-wrap">${domainIcons[domain]}</span>
          <span class="tile-name">${domain}</span>
        </div>
        <p class="tile-desc">${meta.desc}</p>
        <span class="tile-count">${count} initiative${count !== 1 ? 's' : ''}</span>
      </button>`;
    }).join('');
    tileGrid.querySelectorAll('.domain-tile').forEach(btn => {
      btn.addEventListener('click', () => {
        activeDomain = btn.dataset.domain;
        renderTiles();
        renderPanel();
        panelArea.scrollIntoView({ behavior: 'smooth', block: 'start' });
      });
    });
  }

  function renderPanel(){
    if (!activeDomain){
      panelArea.innerHTML = '';
      return;
    }
    const items = itemsFor(activeDomain);
    const meta = domainMeta[activeDomain];
    const cardsHtml = items.length ? items.map(item => `
      <div class="init-card">
        <div class="init-top">
          <span class="init-title">${item.title}</span>
          <div class="badge-row">
            <span class="status-badge ${item.status === 'planned' ? 'planned' : ''}">${item.status === 'live' ? 'Live' : 'Planned'}</span>
            ${item.sample ? '<span class="sample-badge">Sample data</span>' : ''}
          </div>
        </div>
        <div class="detail-block">
          <span class="detail-label">What is it</span>
          <p class="detail-text">${item.whatIsIt}</p>
        </div>
        <div class="detail-block">
          <span class="detail-label">Why MISMO is working on this</span>
          <ul class="why-bullets">${item.whyWorking.map(w => `<li>${w}</li>`).join('')}</ul>
        </div>
        <div class="detail-block">
          <span class="detail-label">Who brought it</span>
          <p class="detail-text">${item.whoBroughtIt}</p>
        </div>
        <div class="detail-block">
          <span class="detail-label">Publication status</span>
          <p class="detail-text">${item.publicationStatus}</p>
        </div>
        <div class="detail-block">
          <span class="detail-label">Estimated savings</span>
          <p class="snapshot-stat">${item.estimatedSavings}</p>
        </div>
        ${item.href ? `<a class="view-link" href="${item.href}">View dashboard →</a>` : `<span class="view-link-disabled">No dashboard yet</span>`}
      </div>
    `).join('') : '';

    panelArea.innerHTML = `
      <div class="panel" style="--tile-color:${meta.color};">
        <div class="panel-head">
          <span class="panel-icon-wrap">${domainIcons[activeDomain]}</span>
          <div>
            <div class="panel-title">${activeDomain}</div>
            <div class="panel-sub">${items.length} initiative${items.length !== 1 ? 's' : ''} in this domain</div>
          </div>
        </div>
        ${items.length ? `<div class="init-grid">${cardsHtml}</div>` : `<div class="empty-hint">No initiatives tagged with this domain yet.</div>`}
      </div>
    `;
  }

  renderTiles();
  renderPanel();

  // Fun intro touch: briefly highlight each domain tile in turn on page load, purely
  // visual — it never sets activeDomain or calls renderPanel, so it can't accidentally
  // open a panel or leave a domain selected once it finishes.
  // Simple synth for the intro tour's tones — pure sine waves, soft envelope,
  // no external audio files needed.
  let audioCtx = null;
  function getAudioContext(){
    if (!audioCtx){
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return null;
      audioCtx = new Ctx();
    }
    return audioCtx;
  }

  function playTone(freq, startTime, duration, ctx){
    const osc = ctx.createOscillator();
    const gainNode = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(freq, startTime);
    osc.connect(gainNode);
    gainNode.connect(ctx.destination);

    // Soft attack/release so each tone feels muted rather than a hard beep.
    const peak = 0.12;
    gainNode.gain.setValueAtTime(0, startTime);
    gainNode.gain.linearRampToValueAtTime(peak, startTime + 0.08);
    gainNode.gain.setValueAtTime(peak, startTime + duration - 0.15);
    gainNode.gain.linearRampToValueAtTime(0, startTime + duration);

    osc.start(startTime);
    osc.stop(startTime + duration);
  }

  function playIntroColorTour(withSound){
    const tiles = [...tileGrid.querySelectorAll('.domain-tile')];
    // Group tiles into visual rows based on their actual rendered top offset,
    // then sort each row left-to-right, so this adapts correctly at any screen
    // width (3 columns, 2, or 1) rather than assuming a fixed grid shape.
    const rows = [];
    tiles.forEach(tile => {
      const top = tile.offsetTop;
      let row = rows.find(r => Math.abs(r.top - top) < 5);
      if (!row){
        row = { top, tiles: [] };
        rows.push(row);
      }
      row.tiles.push(tile);
    });
    rows.forEach(row => row.tiles.sort((a, b) => a.offsetLeft - b.offsetLeft));

    // Ascending phase groups: split tiles by position relative to the main
    // diagonal (top-left to bottom-right) of the row/column grid — below it,
    // on it, then above it. With a 3x3 layout this is exactly:
    //   below: eMortgage, Secondary, Servicing
    //   on:    Artificial Intelligence, Governance, Valuation
    //   above: Compliance, Credit Reporting, Originations
    const belowDiagonal = [], onDiagonal = [], aboveDiagonal = [];
    rows.forEach((row, r) => {
      row.tiles.forEach((tile, c) => {
        if (r > c) belowDiagonal.push(tile);
        else if (r === c) onDiagonal.push(tile);
        else aboveDiagonal.push(tile);
      });
    });
    const diagonalGroups = [belowDiagonal, onDiagonal, aboveDiagonal].filter(g => g.length);

    const descendMs = 1500;
    const ascendMs = 500; // quicker cadence for the ascending phase

    // Descending tones (one per row, high to low), then ascending tones
    // (one per diagonal group, low to high) — Close Encounters-ish.
    // Dropped one octave from the original pitch per earlier feedback.
    const descendNotes = [440.00, 293.66, 220.00]; // A4, D4, A3
    const ascendNotes = [261.63, 329.63, 392.00]; // C4, E4, G4

    // withSound is true whenever this runs — the tour is only ever triggered by
    // the replay button's click handler now, which is always a genuine gesture.
    const ctx = withSound ? getAudioContext() : null;
    function audioIsLive(){ return ctx && ctx.state === 'running'; }

    function highlightGroup(tileGroup, freq, duration, holdMs){
      tileGroup.forEach(tile => tile.classList.add('intro-highlight'));
      if (audioIsLive()) playTone(freq, ctx.currentTime, duration, ctx);
      setTimeout(() => {
        tileGroup.forEach(tile => tile.classList.remove('intro-highlight'));
      }, holdMs);
    }

    // Descending: one row at a time, 1.5s apart.
    rows.forEach((row, i) => {
      setTimeout(() => {
        highlightGroup(row.tiles, descendNotes[i] || descendNotes[descendNotes.length - 1], 0.9, descendMs);
      }, i * descendMs);
    });

    // Ascending: one diagonal group at a time, starting after the descending
    // phase finishes, at a quicker cadence.
    const ascendStart = rows.length * descendMs + 200;
    diagonalGroups.forEach((group, i) => {
      setTimeout(() => {
        highlightGroup(group, ascendNotes[i] || ascendNotes[ascendNotes.length - 1], 0.35, ascendMs);
      }, ascendStart + i * ascendMs);
    });
  }

  // The tour now only ever runs when this button is clicked — nothing plays
  // automatically on page load, visuals or sound. A direct click is a genuine
  // user gesture, so audio is reliably allowed here every time.
  const replayBtn = document.getElementById('replayTourBtn');
  if (replayBtn){
    replayBtn.addEventListener('click', async () => {
      const ctx = getAudioContext();
      if (ctx && ctx.state === 'suspended'){
        try {
          await ctx.resume();
        } catch (err) {
          // If resume() is ever rejected, fall through anyway — the tour still
          // runs visually, and audioIsLive() checks the real state at each
          // step rather than assuming this succeeded.
        }
      }
      playIntroColorTour(true);
    });
  }

  // Dark mode: check for a saved preference (this is a real hosted site, not a
  // sandboxed preview, so localStorage works normally and persists across visits).
  const themeToggleBtn = document.getElementById('themeToggleBtn');
  function applyTheme(theme){
    document.documentElement.setAttribute('data-theme', theme);
    themeToggleBtn.setAttribute('aria-pressed', theme === 'dark' ? 'true' : 'false');
  }
  let savedTheme = 'light';
  try {
    savedTheme = localStorage.getItem('mismo-hub-theme') || 'light';
  } catch (e) {
    // Local storage unavailable — just default to light mode.
  }
  applyTheme(savedTheme);

  themeToggleBtn.addEventListener('click', () => {
    const current = document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
    const next = current === 'dark' ? 'light' : 'dark';
    applyTheme(next);
    try {
      localStorage.setItem('mismo-hub-theme', next);
    } catch (e) {
      // Local storage unavailable — the toggle still works, it just won't persist.
    }
  });
</script>

</body>
</html>
